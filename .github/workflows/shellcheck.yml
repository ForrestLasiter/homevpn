name: shellcheck

# Lint every shell script on push / PR so the repo stays runnable.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          # SC1091: don't fail on sourced files we can't follow (config.env, hub.env)
          SHELLCHECK_OPTS: -e SC1091
        with:
          scandir: '.'
          format: gcc
